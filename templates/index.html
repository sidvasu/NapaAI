<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NapaAI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>NapaAI</h1>
		<h2>
            <a href="/">Top 50 Wines</a>
            <a href="/recommend">Recommender</a>
        </h2>
    </header>

    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1 class="text-white">Top 50 Wines</h1>
            </div>

            {% for i in range(title|length) %}
                {% if i % 4 == 0 %}
                    <div class="clearfix visible-md-block visible-lg-block"></div>
                {% endif %}
            
                <div class="col-md-3 col-sm-6 col-xs-12" style="margin-top:30px;">
                    <div class="card" style="background-color:#2C3F54; padding:15px; border-radius:8px; height:100%;">
                        <div class="card-body">
                            <p style="color: white;"><strong>{{ title[i] }}</strong></p>
                            <p style="color: white;"><strong>Variety:</strong> {{ variety[i] }}</p>
                            <p style="color: white;"><strong>Winery:</strong> {{ winery[i] }}</p>
                            <p style="color: white;"><strong>Price (USD):</strong> ${{ price[i] }}</p>
                        </div>
                    </div>
                </div>

            {% endfor %}

        </div>
    </div>
</body>
</html>
