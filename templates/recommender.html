<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NapaAI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>NapaAI</h1>
		<h2>
            <a href="/">Top 50 Wines</a>
            <a href="/recommend">Recommender</a>
        </h2>
    </header>

    <div class="container">
        <div class="row">
            <div class="d-flex justify-content-center" style="background-color: #2C3F54; padding: 20px;">
                <form action="/recommend" method="POST">
                    <input type="text" name="user_input" id="search-input" placeholder="Search for wines...">
                    <input type="submit" class="btn btn-warning">
                </form>
            </div>

            {% if results and results != -1 %}
                {% for i in results %}
                    <div class="col-md-3 col-sm-6 col-xs-12" style="margin-top:30px;">
                        <div class="card" style="background-color:#2C3F54; padding:15px; border-radius:8px; height:100%;">
                            <div class="card-body">
                                <p style="color: white;"><strong>{{ i[0] }}</strong></p>
                                <p style="color: white;"><strong>Variety:</strong> {{ i[1] }}</p>
                                <p style="color: white;"><strong>Winery:</strong> {{ i[2] }}</p>
                                <p style="color: white;"><strong>Price (USD):</strong> ${{ i[3] }}</p>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}

        </div>
    </div>
</body>
</html>
