<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NapaAI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>NapaAI</h1>
		<h2>
            <a href="/">Top 50 Wines</a>
            <a href="/recommend">Recommender</a>
        </h2>
    </header>

    <div class="container">
        <div class="row">
            <div class="d-flex justify-content-center py-1" style="background-color: #2C3F54;">
                <form action="/recommend" method="POST">
                    <input type="text" name="user_input" id="search-input" placeholder="Search for wines...">
                    <select id="sort-select">
                        <option value="popularity.desc">Sort By</option>
                        <option value="release_date.desc">Origin</option>
                        <option value="vote_average.desc">Type</option>
                        <option value="vote_average.desc">Cost</option>
                        <option value="vote_average.desc">Rating</option>
                    </select>
                    <input type="submit" class="btn btn-warning">
                </form>
            </div>

            {% if results and results != -1 %}
                {% for i in results %}
                    <div class="col-md-3" style="margin-top:50px">
                        <div class="card">
                            <div class="card-body">
                                <p class="text-white">{{ i[0] }}</p>
                                <h4 class="text-white">{{ i[1] }}</h4>
                                <h4 class="text-white">{{ i[2] }}</h4>
                                <h4 class="text-white">{{ i[3] }}</h4>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}

        </div>
    </div>

    <footer>
        <button id="prev-btn">Previous</button>
        <span id="page-number">Page 1</span>
        <button id="next-btn">Next</button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
